<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スケジュール管理アプリ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 長押し時のテキスト選択防止 */
    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* スクロールバーカスタマイズ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col no-select">

  <!-- ヘッダーエリア -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- 左上：メンバー登録ボタン -->
      <div class="flex items-center gap-3">
        <button id="openMemberModalBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-sm transition-all text-sm sm:text-base active:scale-95">
          <i data-lucide="user-plus" class="w-4 h-4 sm:w-5 sm:h-5"></i>
          <span>メンバー登録</span>
        </button>
        <button id="viewMemberListBtn" class="flex items-center gap-1.5 text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl text-xs sm:text-sm transition-all">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span id="memberCountBadge" class="font-semibold text-indigo-600">0</span>名
        </button>
      </div>

      <!-- カレンダー年月切替 -->
      <div class="flex items-center gap-2 sm:gap-4">
        <button id="prevMonthBtn" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <h1 id="currentMonthYear" class="text-base sm:text-xl font-bold text-slate-800 tracking-tight min-w-[120px] text-center">
          2026年 11月
        </h1>
        <button id="nextMonthBtn" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
        <button id="todayBtn" class="hidden sm:block text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium transition-all">
          今日
        </button>
      </div>

      <!-- 右上：更新を通知ボタン -->
      <div>
        <button id="notifyUpdateBtn" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-sm transition-all text-sm sm:text-base active:scale-95">
          <i data-lucide="share-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
          <span class="hidden sm:inline">更新を通知</span>
        </button>
      </div>
    </div>
  </header>

  <!-- サブバー：長押し/複数選択の案内指示バー -->
<!-- ... --><!-- ==================== モーダル3: スケジュール入力 ==================== -->
  <div id="eventModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <div>
          <h3 class="text-lg font-bold text-slate-800">スケジュール入力</h3>
          <p id="eventModalDateDisplay" class="text-xs text-indigo-600 font-semibold mt-0.5">2026年11月12日</p>
        </div>
        <button class="closeModalBtn text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="eventForm" class="space-y-4 my-4">
        <!-- メンバー選択 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">対象メンバー <span class="text-rose-500">*</span></label>
          <select id="eventMemberSelect" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm outline-none bg-white" required>
            <!-- メンバー選択肢 JS生成 -->
          </select>
        </div>

        <!-- 参加ステータスボタン -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">出欠ステータス <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-status="参加" class="statusBtn py-2.5 px-3 rounded-xl border-2 border-transparent bg-blue-500 hover:bg-blue-600 text-white font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-1 opacity-60">
              <i data-lucide="check" class="w-4 h-4"></i>
              参加
            </button>
            <button type="button" data-status="不参加" class="statusBtn py-2.5 px-3 rounded-xl border-2 border-transparent bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-1 opacity-60">
              <i data-lucide="x" class="w-4 h-4"></i>
              不参加
            </button>
            <button type="button" data-status="その他" class="statusBtn py-2.5 px-3 rounded-xl border-2 border-transparent bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-1 opacity-60">
              <i data-lucide="help-circle" class="w-4 h-4"></i>
              その他
            </button>
          </div>
          <input type="hidden" id="eventStatusInput" value="参加" required>
        </div>

        <!-- コメント入力 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">コメント・備考</label>
          <textarea id="eventCommentInput" rows="3" placeholder="遅れて参加します / 理由など" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 text-sm outline-none resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-sm">
          保存する
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== モーダル4: 更新を通知確認・結果モーダル ==================== -->
  <div id="notifyModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="bell" class="w-5 h-5 text-emerald-600"></i>
          更新の通知
        </h3>
        <button class="closeModalBtn text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="my-4 space-y-3">
        <p class="text-sm font-medium text-slate-700">更新を共有しますか？</p>
        <div class="bg-slate-50 p-3 rounded-xl text-xs text-slate-600 space-y-1">
          <div>• 登録中の全スケジュール内容をメール（Gmail）およびLINE登録メンバーへ配信します。</div>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button id="notifyNoBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm transition-all">
          いいえ
        </button>
        <button id="notifyYesBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl text-sm transition-all shadow-sm">
          はい
        </button>
      </div>
    </div>
  </div>

  <!-- スクリプト部 -->
  <script>
    // ==================== アプリケーション状態 ====================
    let currentDate = new Date(); // 表示中の年月

    // 登録メンバー初期データ
    let members = [
      { id: 'm1', name: '佐藤 健太', email: 'sato@example.com', type: 'direct' },
      { id: 'm2', name: '鈴木 美咲', email: 'misaki@example.com', type: 'direct' },
      { id: 'm3', name: 'フットサルグループ (8名)', email: 'LINE Group', type: 'line' },
      { id: 'm4', name: '田中 裕樹 (LINE)', email: 'LINE Friend', type: 'line' }
    ];

    // LINE擬似リスト
    const lineSimData = [
      { id: 'line_g1', name: 'プロジェクトAチーム', type: 'グループ' },
      { id: 'line_g2', name: '大学サークル仲間', type: 'グループ' },
      { id: 'line_f1', name: '高橋 涼太', type: '友達' },
      { id: 'line_f2', name: '渡辺 舞', type: '友達' },
      { id: 'line_f3', name: '伊藤 健', type: '友達' }
    ];

    // イベント（予定）データ
    // dateStr: "YYYY-MM-DD", status: "参加" | "不参加" | "その他"
    let events = [
      {
        id: 'e1',
        memberId: 'm1',
        memberName: '佐藤 健太',
        status: '参加',
        comment: '終日参加可能です',
        dates: ['2026-11-10', '2026-11-11', '2026-11-12'] // 連続日付
      },
      {
        id: 'e2',
        memberId: 'm2',
        memberName: '鈴木 美咲',
        status: '不参加',
        comment: '出張のため欠席',
        dates: ['2026-11-12']
      },
      {
        id: 'e3',
        memberId: 'm3',
        memberName: 'フットサルグループ (8名)',
        status: 'その他',
        comment: '18時以降調整中',
        dates: ['2026-11-20', '2026-11-21']
      }
    ];

    // 長押し・複数選択状態変数
    let selectedDates = []; // YYYY-MM-DD の配列
    let longPressTimer = null;
    let isLongPress = false;

    // ==================== 初期化処理 ====================
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderCalendar();
      updateMemberCount();
      setupEventListeners();
      setupLineFriendsList();
    });

    // ==================== カレンダーレンダリング ====================
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // ヘッダーテキスト設定
      document.getElementById('currentMonthYear').textContent = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      // 月の初日と最終日
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startDayOfWeek = firstDay.getDay(); // 0:日, 1:月...
      const totalDays = lastDay.getDate();

      // 前月の日付埋め
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const cell = createCellElement(null, dayNum, true);
        grid.appendChild(cell);
      }

      // 当月の日付セル作成
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = formatDateStr(year, month + 1, day);
        const cell = createCellElement(dateStr, day, false);
        grid.appendChild(cell);
      }

      // 翌月の日付埋め (6行7列 = 42マスに揃える)
      const totalRendered = startDayOfWeek + totalDays;
      const nextDays = (42 - totalRendered) % 7 === 0 && totalRendered >= 35 ? 42 - totalRendered : (35 - totalRendered);
      for (let i = 1; i <= (nextDays < 0 ? nextDays + 7 : nextDays); i++) {
        const cell = createCellElement(null, i, true);
        grid.appendChild(cell);
      }

      // ルーシッドアイコンの更新
      lucide.createIcons();
    }

    // 単一セル要素の生成
    function createCellElement(dateStr, dayNum, isOtherMonth) {
      const cell = document.createElement('div');
      cell.className = `bg-white min-h-[90px] sm:min-h-[110px] p-1 flex flex-col relative transition-colors ${
        isOtherMonth ? 'bg-slate-50/60 text-slate-300' : 'hover:bg-indigo-50/30 cursor-pointer'
      }`;

      if (isOtherMonth) {
        cell.innerHTML = `<span class="text-xs font-medium p-1">${dayNum}</span>`;
        return cell;
      }

      const isToday = isSameDay(new Date(), new Date(dateStr));
      const isSelected = selectedDates.includes(dateStr);

      if (isSelected) {
        cell.classList.add('bg-indigo-100/80', 'ring-2', 'ring-indigo-500', 'ring-inset');
      }

      // 日付数値ヘッダー
      const dayHeader = document.createElement('div');
      dayHeader.className = 'flex items-center justify-between p-1';
      
      const daySpan = document.createElement('span');
      daySpan.className = `text-xs sm:text-sm font-semibold rounded-full w-6 h-6 flex items-center justify-center ${
        isToday ? 'bg-indigo-600 text-white shadow-sm' : ''
      }`;
      daySpan.textContent = dayNum;
      dayHeader.appendChild(daySpan);

      if (isSelected) {
        const checkIcon = document.createElement('i');
        checkIcon.setAttribute('data-lucide', 'check-circle-2');
        checkIcon.className = 'w-4 h-4 text-indigo-600';
        dayHeader.appendChild(checkIcon);
      }

      cell.appendChild(dayHeader);

      <!-- イベントバー描画領域 -->
      const eventsContainer = document.createElement('div');
      eventsContainer.className = 'flex-1 space-y-1 overflow-hidden mt-1';

      // 当該日付にかかるイベントを取得
      const dayEvents = events.filter(e => e.dates.includes(dateStr));

      dayEvents.forEach(evt => {
        const eventBar = createEventBarElement(evt, dateStr);
        eventsContainer.appendChild(eventBar);
      });

      cell.appendChild(eventsContainer);

      // タップ＆長押しイベントの設定
      attachCellInteractions(cell, dateStr);

      return cell;
    }

    // スケジュールバー（リボン）要素の作成
    function createEventBarElement(evt, currentDateStr) {
      const bar = document.createElement('div');

      // スパン判定 (連続日付の開始・中間・終了)
      const sortedDates = [...evt.dates].sort();
      const isStart = sortedDates[0] === currentDateStr;
      const isEnd = sortedDates[sortedDates.length - 1] === currentDateStr;
      const isMultiDay = sortedDates.length > 1;

      // ステータスに応じたカラーデザイン (参加:青, 不参加:赤, その他:黄)
      let statusBg = 'bg-blue-500 text-white';
      if (evt.status === '不参加') statusBg = 'bg-rose-500 text-white';
      if (evt.status === 'その他') statusBg = 'bg-amber-400 text-slate-900 font-medium';

      let roundedClass = 'rounded-md';
      if (isMultiDay) {
        if (isStart) roundedClass = 'rounded-l-md rounded-r-none mr-[-5px] z-10';
        else if (isEnd) roundedClass = 'rounded-r-md rounded-l-none ml-[-5px] z-10';
        else roundedClass = 'rounded-none mx-[-5px] z-10';
      }

      bar.className = `text-[10px] sm:text-xs px-1.5 py-0.5 ${statusBg} ${roundedClass} shadow-xs truncate flex items-center justify-between gap-1 transition-transform hover:scale-[1.02] cursor-pointer`;
      
      const titleSpan = document.createElement('span');
      titleSpan.className = 'truncate';
      titleSpan.textContent = isStart || !isMultiDay ? `${evt.memberName} (${evt.status})` : `↳ ${evt.memberName}`;

      bar.appendChild(titleSpan);

      // 削除ボタン (単一タップで削除できるように)
      const delBtn = document.createElement('button');
      delBtn.className = 'hover:opacity-80 text-xs px-0.5 rounded ml-auto';
      delBtn.innerHTML = '×';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm(`「${evt.memberName}」の予定を削除しますか？`)) {
          events = events.filter(item => item.id !== evt.id);
          renderCalendar();
        }
      };
      bar.appendChild(delBtn);

      return bar;
    }

    // ==================== タップ & 長押し（複数選択）のロジック ====================
    function attachCellInteractions(cell, dateStr) {
      const startPress = () => {
        isLongPress = false;
        longPressTimer = setTimeout(() => {
          isLongPress = true;
          // 長押し感知時の処理
          toggleDateSelection(dateStr);
          if (navigator.vibrate) navigator.vibrate(50); // バイブレーションフィードバック
        }, 500); // 500msの長押しで発動
      };

      const cancelPress = () => {
        if (longPressTimer) clearTimeout(longPressTimer);
      };

      // タッチイベント (スマホ)
      cell.addEventListener('touchstart', startPress, { passive: true });
      cell.addEventListener('touchend', (e) => {
        cancelPress();
        if (!isLongPress) {
          handleCellClick(dateStr);
        }
      });
      cell.addEventListener('touchmove', cancelPress, { passive: true });

      // マウスイベント (PC)
      cell.addEventListener('mousedown', startPress);
      cell.addEventListener('mouseup', () => {
        cancelPress();
        if (!isLongPress) {
          handleCellClick(dateStr);
        }
      });
      cell.addEventListener('mouseleave', cancelPress);
    }

    // セル通常タップ/クリック時の挙動
    function handleCellClick(dateStr) {
      if (selectedDates.length > 0) {
        // 複数選択モード中にタップされた場合、選択に追加/解除
    // イベントリスナー登録
    function setupEventListeners() {
      // 月移動
      document.getElementById('prevMonthBtn').onclick = () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      };
      document.getElementById('nextMonthBtn').onclick = () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      };
      document.getElementById('todayBtn').onclick = () => {
        currentDate = new Date();
        renderCalendar();
      };

      // 「更新を通知」ボタンクリック
      document.getElementById('notifyUpdateBtn').onclick = () => {
        document.getElementById('notifyModal').classList.remove('hidden');
      };

      // 通知ダイアログ「いいえ」
      document.getElementById('notifyNoBtn').onclick = () => {
        closeAllModals();
      };

      // 通知ダイアログ「はい」
      document.getElementById('notifyYesBtn').onclick = () => {
        closeAllModals();
        
        // データの集計と送信シミュレーション
        const emailRecipients = members.filter(m => m.email && m.email !== '未登録' && m.email !== 'LINE連携済').map(m => m.email);
        const lineRecipients = members.filter(m => m.type === 'line' || m.email === 'LINE連携済');
        
        // 最新の更新内容の概要を作成
        const latestEvent = events[events.length - 1];
        const updateSummary = latestEvent ? `直近の予定: ${latestEvent.memberName} (${latestEvent.status}) [${latestEvent.dates.join(', ')}]` : 'スケジュール更新';

        // Gmail送信用リンク作成のシュミレーション
        if (emailRecipients.length > 0) {
          const mailtoSubject = encodeURIComponent("【スケジュール更新のお知らせ】");
          const mailtoBody = encodeURIComponent(`メンバーの皆様\n\nスケジュールが更新されました。\n更新内容: ${updateSummary}\n総登録スケジュール数: ${events.length}件\n\nご確認よろしくお願いいたします。`);
          // 実際にメールアプリやGmail送信画面を開く動作のシミュレーション（別タブまたはmailto）
          console.log(`Gmail送信先: ${emailRecipients.join(', ')}`);
        }

        // 通知成功メッセージの表示
        setTimeout(() => {
          alert(`【通知送信完了】\n\n・Gmail対象者 (${emailRecipients.length}名) へ送信リンクを生成しました。\n・LINE登録メンバー / グループ (${lineRecipients.length}件) へ更新内容を通知しました！\n\n更新内容: ${updateSummary}`);
        }, 200);
      };

      // 複数選択解除
      document.getElementById('clearSelectionBtn').onclick = () => {
        selectedDates = [];
        updateMultiSelectionUI();
        renderCalendar();
      };

      // 複数選択日付での予定追加ボタン
      document.getElementById('createMultiEventBtn').onclick = () => {
        if (selectedDates.length > 0) {
          openEventModal();
        }
      };

      // モーダル閉じるボタン一括
      document.querySelectorAll('.closeModalBtn').forEach(btn => {
        btn.onclick = () => {
          closeAllModals();
        };
      });

      // メンバー登録モーダル展開
      document.getElementById('openMemberModalBtn').onclick = () => {
        document.getElementById('memberModal').classList.remove('hidden');
      };

      // メンバー一覧モーダル展開
      document.getElementById('viewMemberListBtn').onclick = () => {
        renderMemberList();
        document.getElementById('memberListModal').classList.remove('hidden');
      };

      // メンバー登録タブ切替
      const tabDirect = document.getElementById('tabDirect');
      const tabLine = document.getElementById('tabLine');
      const directForm = document.getElementById('directAddForm');
      const lineSection = document.getElementById('lineAddSection');

      tabDirect.onclick = () => {
        tabDirect.className = 'flex-1 py-2 text-center rounded-lg bg-white shadow-sm text-indigo-600 transition-all';
        tabLine.className = 'flex-1 py-2 text-center rounded-lg text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-1.5';
        directForm.classList.remove('hidden');
        lineSection.classList.add('hidden');
      };

      tabLine.onclick = () => {
        tabLine.className = 'flex-1 py-2 text-center rounded-lg bg-white shadow-sm text-emerald-600 transition-all flex items-center justify-center gap-1.5';
        tabDirect.className = 'flex-1 py-2 text-center rounded-lg text-slate-500 hover:text-slate-800 transition-all';
        lineSection.classList.remove('hidden');
        directForm.classList.add('hidden');
      };

      // 直接入力メンバー登録フォーム送信
      document.getElementById('directAddForm').onsubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById('memberNameInput').value.trim();
        const email = document.getElementById('memberEmailInput').value.trim();

        if (name) {
          members.push({
            id: 'm_' + Date.now(),
            name: name,
            email: email || '未登録',
            type: 'direct'
          });
          document.getElementById('memberNameInput').value = '';
          document.getElementById('memberEmailInput').value = '';
          updateMemberCount();
          closeAllModals();
          alert(`${name}さんをメンバーに登録しました。`);
        }
      };

      // LINE追加ボタン
      document.getElementById('addSelectedLineBtn').onclick = () => {
        const checkedBoxes = document.querySelectorAll('.lineCheck:checked');
        if (checkedBoxes.length === 0) {
          alert('追加するLINE友達またはグループを選択してください。');
          return;
        }

        checkedBoxes.forEach(box => {
          const id = box.value;
          const target = lineSimData.find(item => item.id === id);
          if (target) {
            // 重複チェック
            if (!members.some(m => m.name.includes(target.name))) {
              members.push({
                id: 'm_' + Date.now() + Math.random(),
                name: `${target.name} (${target.type})`,
                email: 'LINE連携済',
                type: 'line'
              });
            }
          }
        });

        updateMemberCount();
        closeAllModals();
        alert('選択したLINEメンバーを追加しました！');
      };

      // 出欠ステータスボタン選択処理
      const statusBtns = document.querySelectorAll('.statusBtn');
      const statusInput = document.getElementById('eventStatusInput');

      statusBtns.forEach(btn => {
        btn.onclick = () => {
          statusBtns.forEach(b => b.classList.add('opacity-60'));
          btn.classList.remove('opacity-60');
          statusInput.value = btn.getAttribute('data-status');
        };
      });
      // 初期状態：参加を選択状態に
      statusBtns[0].classList.remove('opacity-60');

      // スケジュール入力フォーム送信
      document.getElementById('eventForm').onsubmit = (e) => {
        e.preventDefault();
        const memberId = document.getElementById('eventMemberSelect').value;
        const selectedMember = members.find(m => m.id === memberId);
        const status = statusInput.value;
        const comment = document.getElementById('eventCommentInput').value.trim();

        if (!selectedMember || selectedDates.length === 0) return;

        // 日付配列をソート
        const sortedDates = [...selectedDates].sort();

        events.push({
          id: 'e_' + Date.now(),
          memberId: selectedMember.id,
          memberName: selectedMember.name,
          status: status,
          comment: comment,
          dates: sortedDates
        });

        // クリア & 再描画
        selectedDates = [];
        updateMultiSelectionUI();
        closeAllModals();
        renderCalendar();
      };
    }

    // LINE擬似リスト生成
    function setupLineFriendsList() {
      const container = document.getElementById('lineFriendsList');
      container.innerHTML = '';

      lineSimData.forEach(item => {
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 hover:bg-white rounded-lg cursor-pointer transition-colors border border-transparent hover:border-slate-200 text-xs sm:text-sm';
        label.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" value="${item.id}" class="lineCheck w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
            <span class="font-medium text-slate-800">${item.name}</span>
          </div>
          <span class="text-[10px] px-2 py-0.5 rounded-full ${item.type === 'グループ' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">${item.type}</span>
        `;
        container.appendChild(label);
      });
    }

    // メンバー数カウント更新
    function updateMemberCount() {
      document.getElementById('memberCountBadge').textContent = members.length;
    }

    // 登録メンバー一覧モーダルの中身生成
    function renderMemberList() {
      const container = document.getElementById('registeredMembersContainer');
      container.innerHTML = '';

      if (members.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">登録メンバーがいません</p>';
        return;
      }

      members.forEach(m => {
        const item = document.createElement('div');
        item.className = 'py-2.5 flex items-center justify-between';
        item.innerHTML = `
          <div>
            <div class="text-sm font-semibold text-slate-800 flex items-center gap-1.5">
              ${m.name}
              ${m.type === 'line' ? '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.2 rounded font-normal">LINE</span>' : ''}
            </div>
            <div class="text-xs text-slate-400">${m.email}</div>
          </div>
          <button class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1" onclick="deleteMember('${m.id}')">削除</button>
        `;
        container.appendChild(item);
      });
    }

    // メンバー削除
    window.deleteMember = function(id) {
      if (confirm('このメンバーを削除しますか？')) {
        members = members.filter(m => m.id !== id);
        updateMemberCount();
        renderMemberList();
      }
    };

    // スケジュール入力モーダルを開く
    function openEventModal() {
      if (members.length === 0) {
        alert('まず画面左上の「メンバー登録」からメンバーを追加してください。');
        document.getElementById('memberModal').classList.remove('hidden');
        return;
      }

      // 日付テキスト表示設定
      const sortedDates = [...selectedDates].sort();
      const dateDisplay = document.getElementById('eventModalDateDisplay');
      if (sortedDates.length === 1) {
        dateDisplay.textContent = formatDisplayDate(sortedDates[0]);
      } else {
        dateDisplay.textContent = `${formatDisplayDate(sortedDates[0])} 〜 ${formatDisplayDate(sortedDates[sortedDates.length - 1])} (${sortedDates.length}日間)`;
      }

      // メンバーセレクトボックス更新
      const select = document.getElementById('eventMemberSelect');
      select.innerHTML = '';
      members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name;
        select.appendChild(opt);
      });

      // コメントクリア
      document.getElementById('eventCommentInput').value = '';

      document.getElementById('eventModal').classList.remove('hidden');
    }

    // すべてのモーダルを閉じる
    function closeAllModals() {
      document.getElementById('memberModal').classList.add('hidden');
      document.getElementById('memberListModal').classList.add('hidden');
      document.getElementById('eventModal').classList.add('hidden');
      document.getElementById('notifyModal').classList.add('hidden');
    }

    // ==================== ユーティリティ関数 ====================
    function formatDateStr(year, month, day) {
      const y = year;
      const m = String(month).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayDate(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${y}年${parseInt(m)}月${parseInt(d)}日`;
    }

    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }
  </script>
</body>
</html>
